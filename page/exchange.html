<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>即時匯率轉換器</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background-color: #f4f7f6;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .converter-card {
        background: #ffffff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
        text-align: center;
      }

      h2 {
        color: #333;
        margin-bottom: 20px;
      }

      .input-group {
        margin-bottom: 15px;
        text-align: left;
      }

      label {
        display: block;
        font-size: 14px;
        color: #666;
        margin-bottom: 5px;
      }

      input,
      select {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 16px;
        outline: none;
        transition: border-color 0.3s;
      }

      input:focus,
      select:focus {
        border-color: #007bff;
      }

      .swap-text {
        font-size: 14px;
        color: #888;
        margin: 5px 0;
      }

      #convert-btn {
        width: 100%;
        padding: 12px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        font-weight: bold;
        margin-top: 10px;
        transition: background 0.3s;
      }

      #convert-btn:hover {
        background-color: #0056b3;
      }

      .result-box {
        margin-top: 25px;
        padding: 15px;
        background-color: #e9ecef;
        border-radius: 6px;
      }

      #result {
        font-size: 20px;
        font-weight: bold;
        color: #28a745;
      }

      #update-time {
        font-size: 12px;
        color: #999;
        margin-top: 5px;
      }
    </style>
  </head>
  <body>
    <div class="converter-card">
      <h2>即時匯率轉換</h2>

      <div class="input-group">
        <label for="amount">輸入金額</label>
        <input type="number" id="amount" value="100" min="0" />
      </div>

      <div class="input-group">
        <label for="from-currency">從（來源幣別）</label>
        <select id="from-currency">
          <option value="TWD" selected>TWD - 新台幣</option>
          <option value="USD">USD - 美金</option>
          <option value="JPY">JPY - 日圓</option>
          <option value="EUR">EUR - 歐元</option>
          <option value="KRW">KRW - 韓元</option>
        </select>
      </div>

      <div class="swap-text">轉換為</div>

      <div class="input-group">
        <label for="to-currency">到（目標幣別）</label>
        <select id="to-currency">
          <option value="TWD">TWD - 新台幣</option>
          <option value="USD" selected>USD - 美金</option>
          <option value="JPY">JPY - 日圓</option>
          <option value="EUR">EUR - 歐元</option>
          <option value="KRW">KRW - 韓元</option>
        </select>
      </div>

      <button id="convert-btn">立即轉換</button>

      <div class="result-box">
        <div id="result">計算中...</div>
        <div id="update-time">最後更新時間：--</div>
      </div>
    </div>

    <script>
      // 1. 抓取 HTML 元素
      const amountInput = document.getElementById("amount");
      const fromCurrency = document.getElementById("from-currency");
      const toCurrency = document.getElementById("to-currency");
      const convertBtn = document.getElementById("convert-btn");
      const resultText = document.getElementById("result");
      const updateTimeText = document.getElementById("update-time");

      // 2. 核心匯率轉換函式
      async function calculateExchangeRate() {
        const amount = amountInput.value;
        const from = fromCurrency.value;
        const to = toCurrency.value;

        // 檢查金額是否合理
        if (amount === "" || amount <= 0) {
          resultText.innerText = "請輸入有效的金額";
          return;
        }

        resultText.innerText = "正在取得最新匯率...";

        try {
          // 使用免費不需 Key 的 ExchangeRate-API V4
          const apiUrl = `https://api.exchangerate-api.com/v4/latest/${from}`;
          const response = await fetch(apiUrl);

          if (!response.ok) throw new Error("網路回應不成功");

          const data = await response.json();

          // 取得目標貨幣的匯率
          const rate = data.rates[to];
          // 計算轉換後的金額（四捨五入到小數點後兩位）
          const convertedAmount = (amount * rate).toLocaleString(undefined, {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2,
          });

          // 渲染至網頁畫面
          resultText.innerText = `${Number(amount).toLocaleString()} ${from} = ${convertedAmount} ${to}`;
          updateTimeText.innerText = `最後更新日期：${data.date}`;
        } catch (error) {
          console.error("錯誤資訊:", error);
          resultText.innerText = "無法取得匯率，請檢查網路連線。";
        }
      }

      // 3. 設定事件監聽器（當點擊按鈕，或改變選項時自動計算）
      convertBtn.addEventListener("click", calculateExchangeRate);

      // 頁面初次載入時先執行一次
      window.addEventListener("load", calculateExchangeRate);
    </script>
  </body>
</html>
